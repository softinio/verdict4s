# Sidebar order. Without this Laika sorts pages alphabetically by file name,
# which put "Getting started" fifth and the overview in the middle.
#
# Reading order: what it is, first request, the core concepts, then the two
# lower-level modules, then integrations.
laika.navigationOrder = [
  index.md
  getting-started.md
  typed-questions.md
  errors-and-retries.md
  client-module.md
  core-module.md
  effect-systems.md
  api-reference.md
]

# Links into /api are excluded from validation in scripts/LaikaBuild.scala,
# using Laika's typed LinkValidation config.
