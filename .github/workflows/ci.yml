name: "CI"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Test ${{ matrix.platform }} / Scala ${{ matrix.scala-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scala-version: ["3.3.8", "3.9.0"]
        platform: ["jvm", "js"]
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    # Cache Mill dependencies
    - name: Cache Mill
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/mill
          ~/.cache/coursier
          out/
        key: ${{ runner.os }}-mill-${{ matrix.platform }}-${{ matrix.scala-version }}-${{ hashFiles('build.mill') }}
        restore-keys: |
          ${{ runner.os }}-mill-${{ matrix.platform }}-${{ matrix.scala-version }}-
          ${{ runner.os }}-mill-

    # The JDK is not set here: `nix develop` supplies it (see devshell.toml),
    # and the nixpkgs `mill` wrapper pins JAVA_HOME to its own JDK regardless.
    # Print it so the version that actually ran is recorded in the log.
    - name: Report toolchain
      run: |
        nix develop --command bash -c 'java -version; echo "JAVA_HOME=$JAVA_HOME"'

    # Run every module's tests for this platform / Scala version.
    # Scala.js tests run on the Node provided by the devshell.
    - name: Run tests
      run: |
        nix develop --command mill "__.${{ matrix.platform }}[${{ matrix.scala-version }}].test"

    # Check code formatting
    - name: Check code formatting
      if: matrix.platform == 'jvm' && matrix.scala-version == '3.9.0'
      run: |
        nix develop --command mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources

    # Nothing else enforces these, and a missing header goes unnoticed for
    # months. The year is matched loosely so new files need no change here.
    - name: Check licence headers
      if: matrix.platform == 'jvm' && matrix.scala-version == '3.9.0'
      run: |
        missing=$(git ls-files '*.scala' '*.mill' | xargs grep -L 'Copyright .* Salar Rahmanian' || true)
        if [ -n "$missing" ]; then
          echo "Missing licence header:"
          echo "$missing"
          exit 1
        fi

    # Build documentation for every module, on the 3.3.8 LTS the library
    # publishes from. (Scaladoc 3.9.0 drops the jQuery tag its own ux.js needs,
    # which breaks every link in the generated pages.)
    - name: Generate documentation
      if: matrix.platform == 'jvm' && matrix.scala-version == '3.3.8'
      run: |
        nix develop --command mill "__.jvm[3.3.8].docJar"

    # The interop examples (ZIO, Future, JDK HttpClient) are real
    # sources so the effect-systems page cannot rot. Unpublished, JVM only,
    # one Scala version -- one extra target rather than four.
    - name: Compile interop examples
      if: matrix.platform == 'jvm' && matrix.scala-version == '3.9.0'
      run: |
        nix develop --command mill verdict4s-examples.compile

    # Upload test results
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.platform }}-${{ matrix.scala-version }}
        path: |
          out/**/${{ matrix.platform }}/${{ matrix.scala-version }}/test/
        retention-days: 7

  jdk-compat:
    name: JVM tests on Java ${{ matrix.jdk }} / Scala ${{ matrix.scala-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ["17", "25"]
        scala-version: ["3.3.8", "3.9.0"]
    # The `tests` job above already covers Java 21, the JDK the devshell's Mill
    # runs on. The artifacts target 17 (`--release 17`), which guarantees the
    # API surface exists there but not that the code behaves identically, so
    # this job runs the suite on that floor and on the newest LTS as well.
    env:
      VERDICT4S_JVM: "temurin:${{ matrix.jdk }}"
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Mill
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/mill
          ~/.cache/coursier
          out/
        key: ${{ runner.os }}-mill-jdk${{ matrix.jdk }}-${{ matrix.scala-version }}-${{ hashFiles('build.mill') }}
        restore-keys: |
          ${{ runner.os }}-mill-jdk${{ matrix.jdk }}-${{ matrix.scala-version }}-
          ${{ runner.os }}-mill-

    - name: Report toolchain
      run: |
        nix develop --command bash -c 'java -version; echo "JAVA_HOME=$JAVA_HOME"'
        echo "Mill will resolve and run tests on: $VERDICT4S_JVM"

    - name: Run JVM tests
      run: |
        nix develop --command mill "__.jvm[${{ matrix.scala-version }}].test"

  site:
    name: Generate Site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    # Cache Mill dependencies
    - name: Cache Mill
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/mill
          ~/.cache/coursier
        key: ${{ runner.os }}-mill-docs-${{ hashFiles('build.mill') }}
        restore-keys: |
          ${{ runner.os }}-mill-docs-

    # docs.build renders the narrative site and copies the combined scaladoc
    # in under api/, so the reference links resolve. This only proves the site
    # builds; it is published from a release tag by docs.yml.
    - name: Generate site
      run: |
        nix develop --command mill --no-daemon docs.build
